[project]
name = "ai-reviewer"
version = "0.1.0"
description = "AI-assisted first-pass screening of job applications against a two-gate rubric"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_reviewer"]
